<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nabídky práce</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Nabídky práce</h1>
  <p id="meta" class="muted">Načítám...</p>
  <form id="add-keyword-form" class="add-keyword-form">
    <input id="add-keyword-input" type="text" placeholder="firma nebo slovo v pozici, např. stavbyvedoucí" autocomplete="off">
    <button type="submit">🚫 Přidat do blacklistu</button>
  </form>
  <p id="add-keyword-status" class="muted add-keyword-status"></p>
  <button id="blacklist-toggle" type="button" class="blacklist-toggle">Zobrazit blacklist</button>
  <div id="blacklist-list" class="blacklist-list" hidden></div>
</header>

<div id="warnings"></div>

<main id="runs"></main>

<footer class="muted">
  <p>
    Zdroj: jobs.cz, prace.cz a LinkedIn podle filtrů v <code>config/settings.yaml</code>.
    Firmu nebo klíčové slovo v pozici, které nechceš vidět, přidej do <code>config/blacklist.txt</code>.
  </p>
</footer>

<script src="app.js"></script>
</body>
</html>
