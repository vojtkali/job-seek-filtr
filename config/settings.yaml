# Nastavení hlídače nabídek práce.
#
# search_urls jsou reálné URL zkopírované z prohlížeče po ručním nastavení
# filtru na jobs.cz / prace.cz (lokalita, plat, obor...). Filtrování tak dělá
# přímo web - scraper jen čte výsledky a hlídá, co je nové.
#
# Pozor: parametr "date" (např. date=24h na jobs.cz, "jen za posledních
# 24 hodin") je ze search_urls schválně VYNECHANÝ. Kdyby tam zůstal, tak by
# se po víkendu (kdy scraper neběží) ztratily nabídky ze soboty a neděle -
# pondělní běh by viděl jen posledních 24 hodin, ne celý víkend. Scraper si
# místo toho pamatuje ID naposledy viděných nabídek (data/state.json) a sám
# pozná, co je nové od posledního běhu, ať uplynul den nebo tři.

jobscz:
  enabled: true
  name: "Jobs.cz"
  search_urls:
    - "https://www.jobs.cz/prace/praha/?salary=69000&locality[code]=R200000&locality[label]=Praha&locality[coords]=50.08455,14.41778&locality[radius]=0"
  # Web stránkuje přes ?page=N - scraper si tenhle parametr sám dosazuje a
  # postupně zvyšuje, dokud nedojde na konec výsledků nebo na max_pages.
  pagination_param: "page"
  # Vzor v URL nabídky, podle kterého scraper pozná odkaz na detail nabídky
  # (a ne třeba na navigaci webu). Uprav, pokud scraper nic nenajde.
  detail_url_pattern: "/rpd/"
  # Nápovědy pro hledání jména zaměstnavatele / platu v HTML (class/data-testid
  # obsahující libovolné z těchto slov, case-insensitive). Uprav podle skutečné
  # struktury stránky, když scraper firmu/plat nenajde (v digestu se pak
  # u nabídky ukáže "Neznámý zaměstnavatel").
  employer_hints: ["company", "employer", "firma", "zamestnavatel"]
  salary_hints: ["salary", "plat", "wage", "mzda"]
  max_pages: 8

pracecz:
  enabled: true
  name: "Prace.cz"
  # Obory (Doprava a zásobování, Služby, Administrativa, Informatika, Kultura
  # umění a tvůrčí práce, Marketing média a reklama, Zákaznický servis,
  # Ostatní, Prodej a obchod), Praha, plný úvazek, plat od 50 000 Kč - všechno
  # v jedné URL přes opakované workAreaIds[].
  search_urls:
    - "https://www.prace.cz/hledat/?workAreaIds[]=200900005;200900019&workAreaIds[]=200900025;200900029&workAreaIds[]=200900001&workAreaIds[]=200900011;200900012;200900013&workAreaIds[]=200900014&workAreaIds[]=200900017;200900018&workAreaIds[]=200900042&workAreaIds[]=200900038;200900039&workAreaIds[]=200900026&workLocationIds[]=R200000;0&jobTypes[]=FULL_TIME&salaryMin=50000&salaryCurrency=CZK"
  # Odhad - na prace.cz jsem stránkování přes URL neověřil. Pokud scraper
  # najde jen nabídky z první stránky, zkontroluj v prohlížeči, jak vypadá
  # URL druhé stránky výsledků, a uprav (nebo nastav na null a scraper zkusí
  # najít odkaz "Další").
  pagination_param: "page"
  detail_url_pattern: "/nabidka/"
  employer_hints: ["company", "employer", "firma", "zamestnavatel"]
  salary_hints: ["salary", "plat", "wage", "mzda"]
  max_pages: 8

# Kolik posledních ID nabídek na jeden web si scraper pamatuje, aby stejnou
# nabídku znovu nenahlásil jako novou. Klidně nech, jen ať to nikdy neklesne
# pod pár tisíc.
seen_ids_limit: 5000

# Kolik nabídek maximálně zobrazit na stránce (nejnovější první).
max_digest_items: 300
