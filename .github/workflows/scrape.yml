name: Scrape job offers

on:
  schedule:
    # 8:00 UTC = cca 9-10h ráno v Praze (podle letního/zimního času).
    # Pondělí (den 1) tak přirozeně zachytí i vše nové z víkendu, protože
    # scraper si pamatuje ID naposledy viděných nabídek, ne přesné datum.
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python -m scraper.main

      - name: Commit updated data
        run: |
          git config user.name "job-seek-filtr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/history.json site/data.json
          git diff --cached --quiet || git commit -m "Aktualizace nabídek $(date -u +%Y-%m-%d)"
          git push

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
